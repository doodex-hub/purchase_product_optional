# Instance BARU untuk migrasi 18.0 (Step 6, Checkpoint G1 — Install Test).
# Modul: purchase_product_optional (target: Odoo 18.0)
#
# TERPISAH SENGAJA dari instance BACKFILL 17.0 (`docker-env/` di source-codebase,
# `purchase-product-optional`, port 8079) — supaya kedua instance bisa hidup BERSAMAAN tanpa
# bentrok kalau suatu saat perlu dibandingkan langsung (17.0 vs 18.0). Penamaan unik:
# - `name:` project eksplisit (bukan auto dari nama folder)
# - port host 8082 (beda dari instance 17.0 di 8079 — 8081 dicoba dulu 2026-07-29, ternyata
#   sudah dipakai proses lain di komputer dev, pindah ke 8082)
# - volume db + network otomatis ikut ter-prefix nama project di atas, jadi tidak perlu diberi
#   nama eksplisit lagi (Docker Compose men-generate `purchase_product_optional_18_db-data`, dst)
#
# !! SWITCH KE G2 (2026-07-29) !! -- G1 (install test, db `_install`) sudah PASS (lihat
# 06c_IMPLEMENTATION_LOG.md). Command di bawah diganti untuk G2 (validasi runtime via browser) --
# database BARU `_demo` (terpisah dari `_install` supaya tidak bentrok/tertimpa), `--stop-after-init`
# DIHAPUS supaya server TETAP HIDUP setelah `docker compose up` (disengaja, biar Claude in Chrome /
# dev bisa buka http://localhost:8082). Matikan manual (`docker compose down`/Ctrl+C) setelah
# verifikasi G2 selesai. Untuk balik ke G1 (kalau perlu re-test install): kembalikan db ke
# `_install` dan tambahkan lagi `--stop-after-init`.
#
# !! REVISI G2 lanjutan (2026-07-29, MF-14) !! -- `depends` modul ditambah `'sale'` (lihat
# __manifest__.py + FINDINGS.md MF-14). Modul SUDAH terinstall di db `_demo` yang sedang jalan --
# `-i` saja TIDAK akan mendeteksi dependency baru pada modul yang statusnya sudah "installed". Ganti
# `-i` -> `-u` (update) supaya Odoo mengevaluasi ulang graph dependency dan otomatis install `sale`
# yang belum pernah ada di db ini.
#
# !! SWITCH KE STEP 9 (2026-07-29, Dev Testing) !! -- G2 SELESAI (MF-13/MF-14 resolved &
# terverifikasi, termasuk AC-01-09 dites live via browser). Command di bawah diganti untuk re-run
# suite `tests/*.py` (11 TC, baseline BACKFILL 17.0 run #7) sebagai bukti regresi di 18.0:
# - Database BARU `_test` (fresh, bukan `_demo` yang sudah dipakai G2 — supaya `-i` install ulang
#   dari nol termasuk dependency baru `sale`, tidak perlu `-u`).
# - `--test-enable --test-tags /purchase_product_optional` -- jalankan HANYA test milik modul ini
#   (bukan seluruh test suite Odoo).
# - `--stop-after-init` -- container akan EXIT sendiri setelah test selesai (beda dari G2 yang
#   sengaja dibiarkan hidup) -- ini normal, cek hasilnya dari `docker-env/logs/odoo.log`.
# - **Ekspektasi Tour/QUnit tetap SKIP** (bukan bug baru) -- BACKFILL 17.0 sudah membuktikan
#   `odoo:17.0` resmi tidak menyertakan Chrome/Chromium, dan percobaan menambah Chrome ke image
#   GAGAL (run #6 BACKFILL, `apt-get install chromium` exit code 100, package tidak tersedia di
#   base image) -- sudah di-treat sebagai limitasi lingkungan permanen, BUKAN dikejar lagi di sini.
#   `odoo:18.0` kemungkinan besar sama. Kalau ternyata Tour/QUnit skip lagi dengan pesan serupa,
#   ini EXPECTED, bukan masalah baru yang perlu di-workaround ulang.
#
# !! SWITCH KE STEP 10 (2026-07-29, QA Testing) !! -- Step 9 SELESAI (11/11 pass). Command
# dikembalikan ke mode server-hidup (pola sama seperti G2) supaya Claude in Chrome / dev bisa
# eksplorasi interaktif lagi -- pakai db `_demo` (sudah punya `sale` terinstall + data test dari G2
# sebelumnya, termasuk PO P00012), BUKAN `_test` (khusus automated test run, jangan dipakai untuk
# eksplorasi manual supaya tidak tercampur). `--test-enable`/`--test-tags`/`--stop-after-init`
# semua dihapus lagi.
name: purchase_product_optional_18

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8082:8069"
    volumes:
      - D:/Kuncoro/doodex/repo/purchase-product-18/purchase_product_optional:/mnt/extra-addons/purchase_product_optional
      - ./logs:/var/log/odoo
    command: >
      odoo -d purchase_product_optional_18_demo
      -u purchase_product_optional
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
